[package]
name = "snailuu-forge"
version = "0.1.0"
edition = "2021"
authors = ["snailuu"]
description = "Forge 服务器部署工具"
license = "MIT"
repository = "https://github.com/snailuu/forge"
keywords = ["forge", "minecraft", "server", "deploy"]
categories = ["command-line-utilities"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
dialoguer = "0.11"
colored = "2"
regex = "1"
indicatif = "0.17"
