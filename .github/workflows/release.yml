name: Build and Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Determine suffix
        id: suffix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "suffix=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "suffix=-main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "suffix=-pr" >> $GITHUB_OUTPUT
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz forge
          mv forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAG_NAME="main-latest"
            PRERELEASE=true
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            TAG_NAME="dev-latest"
            PRERELEASE=true
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.tag_name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          files: |
            forge-*/forge-*.tar.gz
