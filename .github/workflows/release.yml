name: Build and Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Determine suffix
        id: suffix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "suffix=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "suffix=-main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "suffix=-pr" >> $GITHUB_OUTPUT
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz forge
          mv forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: forge-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            forge-*/forge-*.tar.gz
